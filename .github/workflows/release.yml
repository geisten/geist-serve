# Tag v* → the geisten packages (Ubuntu DEBs, the signed rootless installer when
# its key is set), SHA256SUMS and a CycloneDX SBOM, with signed build provenance,
# attached to a GitHub release. The standalone geist-serve server, its install.sh,
# systemd units and Homebrew formula are retired (#148): geist-app and geistd serve
# the same APIs.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      package: ${{ steps.version.outputs.package }}
    steps:
      - id: version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          version=0.3.0
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            version=${RELEASE_REF#refs/tags/v}
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "package=$version" >> "$GITHUB_OUTPUT"

  verify:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      package_version: ${{ needs.version.outputs.package }}
    permissions:
      contents: read

  publish:
    needs: [version, verify]
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write     # Sigstore signing for the provenance attestation
      attestations: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: candidates
          pattern: ubuntu-*-candidate
      - name: assemble
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.package }}
          GEIST_MANIFEST_SIGNING_KEY: ${{ secrets.GEIST_MANIFEST_SIGNING_KEY }}
        run: |
          mkdir -p dist
          cp candidates/ubuntu-amd64-candidate/*.deb dist/
          cp "candidates/ubuntu-arm64-candidate/geisten_${PACKAGE_VERSION}_arm64.deb" dist/
          if [ -n "$GEIST_MANIFEST_SIGNING_KEY" ]; then
            cp candidates/ubuntu-*-candidate/geisten-"$PACKAGE_VERSION"-linux-*.tar.gz scripts/install-geisten.sh dist/
            python3 scripts/installer-manifest.py dist "$PACKAGE_VERSION" "$GITHUB_SHA" "$(sed -n 's/^GEIST_REF *?= *//p' Makefile)"
            key=$(mktemp); trap 'rm -f "$key"' EXIT
            printf '%s\n' "$GEIST_MANIFEST_SIGNING_KEY" >"$key"
            sh scripts/sign-manifest.sh dist/geisten-manifest "$key"
            # the secret must match the key pinned in the installer it ships with
            pinned=$(sed -n "/^GEIST_MANIFEST_PUBKEY='/,/-----END/p" scripts/install-geisten.sh | tr -d "'" | sed 's/^GEIST_MANIFEST_PUBKEY=//')
            [ "$(openssl pkey -in "$key" -pubout)" = "$pinned" ] || { echo "::error::GEIST_MANIFEST_SIGNING_KEY does not match GEIST_MANIFEST_PUBKEY"; exit 1; }
          else
            echo "::notice::GEIST_MANIFEST_SIGNING_KEY is not set: no rootless Linux installer assets (#46)"
          fi
          python3 scripts/sbom.py dist/geist-serve.cdx.json "$PACKAGE_VERSION"
          python3 scripts/release-manifest.py dist "$PACKAGE_VERSION"
          (cd dist && sha256sum -c SHA256SUMS)
      # Signed build provenance (Sigstore, stored by GitHub) for every file
      # that is uploaded, SBOM and checksum files included (#34 §2). Check a
      # download with: gh attestation verify <file> --repo geisten/geist-serve
      - name: attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes

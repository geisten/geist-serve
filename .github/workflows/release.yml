# Tag v* → three static binaries + SHA256SUMS + the systemd units, attached
# to a GitHub release. Linux is musl-static from Alpine (runs on any 64-bit
# distro, Raspberry Pi OS included); macOS links libomp statically.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      package: ${{ steps.version.outputs.package }}
    steps:
      - id: version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          version=0.3.0
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            version=${RELEASE_REF#refs/tags/v}
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "package=$version" >> "$GITHUB_OUTPUT"

  verify:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      package_version: ${{ needs.version.outputs.package }}
    permissions:
      contents: read

  linux:
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: geist-serve-linux-x86_64
          - runner: ubuntu-24.04-arm
            asset: geist-serve-linux-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: build static (pinned Alpine, musl)
        run: |
          docker run --rm -v "$PWD:/w" -w /w alpine:3.23@sha256:85fe1e81d6758c208f3e1eed4338a1997e19d4be002d4dd32d3100c9a8c010a0 sh -ec '
            apk add --no-cache build-base linux-headers git >/dev/null
            git config --global --add safe.directory /w
            make TARGET=linux CC=gcc GEMM_PROVIDER=native EXTRA_LDFLAGS=-static
          '
          cp geist-serve ${{ matrix.asset }}
          cp geistd ${{ matrix.asset }}-geistd
      - name: sanity on glibc (static binary runs here too)
        run: |
          file ${{ matrix.asset }} | grep -q 'statically linked'
          ./${{ matrix.asset }} 2>/dev/null || test $? -eq 2
          ./${{ matrix.asset }}-geistd 2>/dev/null || test $? -eq 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}-geistd

  macos:
    timeout-minutes: 30
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: deps
        run: brew install libomp
      - name: build (static libomp)
        run: make GEIST_STATIC_OMP=1 && cp geist-serve geist-serve-macos-arm64 && cp geistd geist-serve-macos-arm64-geistd
      - name: sanity (no Homebrew library at runtime)
        run: |
          ! otool -L geist-serve-macos-arm64 | grep -q homebrew
          ./geist-serve-macos-arm64 2>/dev/null || test $? -eq 2
          ./geist-serve-macos-arm64-geistd 2>/dev/null || test $? -eq 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: geist-serve-macos-arm64
          path: |
            geist-serve-macos-arm64
            geist-serve-macos-arm64-geistd

  publish:
    needs: [version, verify, linux, macos]
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: geist-serve-*
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: candidates
          pattern: ubuntu-*-candidate
      - name: assemble
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.package }}
        run: |
          cp deploy/systemd/geist-serve.socket deploy/systemd/geist-serve.service deploy/systemd/geist-serve.default dist/
          cp candidates/ubuntu-amd64-candidate/*.deb dist/
          cp candidates/ubuntu-arm64-candidate/*.deb dist/
          python3 scripts/release-manifest.py dist "$PACKAGE_VERSION"
          (cd dist && sha256sum -c SHA256SUMS)
      - name: installer against these exact assets
        run: |
          GEIST_SERVE_BASE="file://$PWD/dist" GEIST_SERVE_PREFIX=/tmp/gs-prefix sh install.sh
          /tmp/gs-prefix/bin/geist-serve 2>/dev/null || test $? -eq 2
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
      # Homebrew formula in geisten/homebrew-tap, pushed with a deploy key
      # that can write that one repository and nothing else (secret
      # TAP_DEPLOY_KEY; the public half is registered on the tap).
      - name: bump homebrew tap
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then echo "::notice::TAP_DEPLOY_KEY not set — run scripts/bump-tap.sh $GITHUB_REF_NAME by hand"; exit 0; fi
          umask 077; printf '%s\n' "$TAP_DEPLOY_KEY" > /tmp/tap_key
          export GIT_SSH_COMMAND="ssh -i /tmp/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          TAP=$(mktemp -d)/homebrew-tap
          git clone -q git@github.com:geisten/homebrew-tap "$TAP"
          sh scripts/bump-tap.sh "$GITHUB_REF_NAME" "$TAP"
          git -C "$TAP" push -q origin HEAD:main
          rm -f /tmp/tap_key

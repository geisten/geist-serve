name: installer candidates
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubuntu:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build pinned daemon and fetch verified test model
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-14 libcurl4-openssl-dev libssl-dev
          make CC=gcc-14 TARGET=linux geistd fetch-model
      - name: Build static installer payload
        run: |
          mkdir -p build/package
          docker run --rm \
            --mount "type=bind,source=$PWD,target=/source,readonly" \
            --mount "type=bind,source=$PWD/build/package,target=/out" \
            alpine:3.23@sha256:85fe1e81d6758c208f3e1eed4338a1997e19d4be002d4dd32d3100c9a8c010a0 \
            sh /source/scripts/build-linux-candidate.sh '${{ matrix.arch }}'
      - name: Installed package, real inference and lifecycle
        run: |
          set -o pipefail
          sudo env GEIST_INSTALLER_TEST=1 GEIST_REQUIRE_SYSTEMD=1 \
            GEIST_TEST_MODEL="$PWD/geistlib/gguf_artifacts/smollm2-360m-instruct-q8_0.gguf" \
            sh tests/install/ubuntu.sh "build/package/geist_0.3.0_${{ matrix.arch }}.deb" "$PWD" \
            2>&1 | tee build/package/acceptance.log
      - name: Record source identity
        run: |
          git rev-parse HEAD > build/package/source-commit.txt
          git -C geistlib rev-parse HEAD > build/package/engine-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ubuntu-${{ matrix.arch }}-candidate
          if-no-files-found: error
          path: |
            build/package/*.deb
            build/package/*.deb.sha256
            build/package/*-commit.txt
            build/package/app-build-packages.txt
            build/package/acceptance.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: ubuntu-${{ matrix.arch }}-diagnostics
          path: build/package/acceptance.log

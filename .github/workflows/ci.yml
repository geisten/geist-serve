name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      package_version:
        type: string
        default: '0.5.30'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 25
    strategy:
      matrix:
        # -std=c23 needs gcc >= 14; force the generic linux target — the
        # GitHub arm runners otherwise auto-detect as pi5 (cortex-a76).
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: deps
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-14 libcurl4-openssl-dev libssl-dev
      - name: build
        run: make CC=gcc-14 TARGET=linux && make app test-app APP_CC=gcc-14
      - name: usage exits 2
        run: ./geist-serve 2>/dev/null || test $? -eq 2
      - name: installer failure and rollback tests
        run: |
          python3 tests/install/legacy_test.py
          python3 tests/install/manifest_test.py
          python3 tests/install/sbom_test.py
          CC=gcc-14 python3 tests/install/bootstrap_test.py
      - name: mini benchmark (model-free)
        run: python3 workbench/test_bench.py
      - name: unit tests (model-free)
        run: make CC=gcc-14 TARGET=linux build/test_template build/test_net_signal && ./build/test_template && ./build/test_net_signal
      - name: systemd units parse
        run: |
          sudo install -m 0755 geist-serve /usr/local/bin/geist-serve
          systemd-analyze verify --man=no deploy/systemd/geist-serve.socket deploy/systemd/geist-serve.service

  build-macos:
    timeout-minutes: 25
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: deps
        run: brew install libomp
      - name: build
        run: make && make app test-app
      - name: usage exits 2
        run: ./geist-serve 2>/dev/null || test $? -eq 2
      - name: installer failure and rollback tests
        run: |
          python3 tests/install/legacy_test.py
          python3 tests/install/manifest_test.py
          python3 tests/install/sbom_test.py
      - name: unit tests (model-free)
        run: make build/test_template build/test_net_signal && ./build/test_template && ./build/test_net_signal

  # The real thing: the HTTP contract against a model, on every runner OS
  # and CPU we ship for. ~369 MB SmolLM2, cached under the same key the
  # engine's own CI uses (the key embeds the SHA pin, so a re-pin rotates it).
  smoke:
    needs: [build, build-macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            make: make CC=gcc-14 TARGET=linux
          - runner: ubuntu-24.04-arm
            make: make CC=gcc-14 TARGET=linux
          - runner: macos-15
            make: make
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: deps (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-14 libcurl4-openssl-dev libssl-dev curl python3
      - name: deps (macos)
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: build
        run: ${{ matrix.make }}
      - name: cache reference model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: geistlib/gguf_artifacts/smollm2-360m-instruct-q8_0.gguf
          key: geist-model-smollm2-360m-q8-48ab3034d0dd
      - name: fetch reference model (SHA-verified)
        run: ${{ matrix.make }} fetch-model
      - name: smoke + wire-level suite
        run: OMP_NUM_THREADS=3 ${{ matrix.make }} test
      - name: app integration with sanitizers
        env:
          GEIST_TEST_MODEL: geistlib/gguf_artifacts/smollm2-360m-instruct-q8_0.gguf
        run: |
          if [ "${{ runner.os }}" = Linux ]; then export APP_CC=gcc-14; fi
          make -f App.mk app build/geist-app-test build/test_app_performance build/test_app_engine_identity build/test_app_output
          make -f App.mk build/test_app_activity build/test_app_lifecycle
          ./build/test_app_lifecycle
          ./build/test_app_activity
          GEIST_APP_TEST_BINARY=build/geist-app-test python3 tests/app/activity_test.py
          GEIST_APP_TEST_BINARY=build/geist-app-test python3 tests/app/lifecycle_fault_test.py
          ./build/test_app_output
          GEIST_APP_TEST_BINARY=build/geist-app-test python3 tests/app/reasoning_test.py
          GEIST_APP_TEST_BINARY=build/geist-app-test python3 tests/app/deadline_test.py
          GEIST_APP_TEST_BINARY=build/geist-app-test python3 tests/app/http_test.py
          GEIST_APP_TEST_BINARY=build/geist-app-test python3 tests/app/compat_test.py
          GEIST_APP_TEST_BINARY=build/geist-app-test python3 tests/app/chat_test.py
          GEIST_APP_TEST_BINARY=build/geist-app-test python3 tests/app/catalog_test.py
          GEIST_EXECUTION_DAEMON="$PWD/geistd" python3 tests/app/execution_test.py
          python3 tests/app/cli_test.py
          GEIST_EXECUTION_DAEMON="$PWD/geistd" python3 tests/app/engine_identity_test.py
          python3 tests/app/performance_test.py
          GEIST_EXECUTION_DAEMON="$PWD/geistd" python3 tests/app/performance_real_test.py
          python3 tests/app/verification_test.py
          python3 tests/app/download_test.py
          python3 tests/app/daemon_test.py

  # Line coverage of C, Python and the web UI over the full suites
  # (scripts/coverage.sh): make test, make test-app, the installer, tool and
  # benchmark tests, and the WebView checks in headless Chrome. The minimums
  # only rise; lower one only with a written reason in the PR.
  coverage:
    needs: [build-macos]
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: deps
        run: brew install libomp
      - name: build
        run: make
      - name: cache reference model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: geistlib/gguf_artifacts/smollm2-360m-instruct-q8_0.gguf
          key: geist-model-smollm2-360m-q8-48ab3034d0dd
      - name: fetch reference model (SHA-verified)
        run: make fetch-model
      - name: coverage
        env:
          GEIST_TEST_MODEL: ${{ github.workspace }}/geistlib/gguf_artifacts/smollm2-360m-instruct-q8_0.gguf
          OMP_NUM_THREADS: 3
        run: make coverage COVERAGE_MIN=86 COVERAGE_PYTHON_MIN=88 COVERAGE_WEB_MIN=94
      - name: coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            build/coverage/report.txt
            build/coverage/python.txt
            build/coverage/web.txt
            build/coverage/web.json
            build/coverage/lcov.info
          if-no-files-found: ignore

  # #142: the Connect-page snippets run unchanged with the current OpenAI SDKs.
  # Not a required check: a new SDK release must show up here, not block merges.
  snippets:
    needs: [build-macos]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: deps
        run: brew install libomp
      - name: build
        run: make && make geist-app
      - name: cache reference model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: geistlib/gguf_artifacts/smollm2-360m-instruct-q8_0.gguf
          key: geist-model-smollm2-360m-q8-48ab3034d0dd
      - name: fetch reference model (SHA-verified)
        run: make fetch-model
      - name: SDKs
        run: |
          python3 -m venv "$RUNNER_TEMP/sdk" && "$RUNNER_TEMP/sdk/bin/pip" install -q openai
          npm install -s --prefix "$RUNNER_TEMP/sdknode" openai
      - name: run every snippet
        env:
          GEIST_TEST_MODEL: ${{ github.workspace }}/geistlib/gguf_artifacts/smollm2-360m-instruct-q8_0.gguf
          GEIST_SNIPPETS_REQUIRED: terminal,python,javascript,go,java
        run: |
          export PATH="$RUNNER_TEMP/sdk/bin:$PATH" GEIST_SNIPPETS_NODE_MODULES="$RUNNER_TEMP/sdknode/node_modules"
          python3 tests/app/snippets_test.py

  installers:
    uses: ./.github/workflows/installers.yml
    with:
      package_version: ${{ inputs.package_version || '0.5.30' }}
    permissions:
      contents: read

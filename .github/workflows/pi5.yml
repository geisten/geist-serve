# Raspberry Pi 5: build, the full HTTP contract, and one decode number —
# on the reference board through its self-hosted runner. Manual only: the
# board is shared and thermally fragile, so every heavy step goes through
# ~/bin/with-pi-lock (see CLAUDE.local.md in the engine repo).
name: pi5

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi5
  cancel-in-progress: false

jobs:
  run:
    runs-on: [self-hosted, pi5]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build (clones the pinned engine)
        run: ~/bin/with-pi-lock make TARGET=pi5
      - name: reference model (SHA-gated, cached in the engine tree)
        run: make TARGET=pi5 fetch-model
      - name: board must be cool and idle before measuring
        run: |
          t=$(cat /sys/class/thermal/thermal_zone0/temp); l=$(cut -d' ' -f1 /proc/loadavg)
          echo "temp=$t load=$l"; test "$t" -lt 60000
      - name: smoke + wire-level suite
        run: OMP_NUM_THREADS=4 ~/bin/with-pi-lock make TARGET=pi5 test
      - name: decode and prefill rate through a geistd chat
        run: |
          ~/bin/with-pi-lock sh -c '
            OMP_NUM_THREADS=4 ./geistd geistlib/gguf_artifacts/smollm2-360m-instruct-q8_0.gguf --socket /tmp/pi5-rate.sock 2>/tmp/gd.log &
            pid=$!; for i in $(seq 1 60); do grep -q listening /tmp/gd.log && break; sleep 1; done
            python3 -c "
          import sys; sys.path.insert(0, \"clients\"); import geistd
          ch = geistd.Client(path=\"/tmp/pi5-rate.sock\").chat()
          ch.ask(\"Write a paragraph about rivers.\", max=64); s = ch.last
          print(\"decode tok/s:\", round(s[\"output_tokens\"] / (s[\"generation_ms\"] / 1e3), 1),
                \"prefill tok/s:\", round(s[\"input_tokens\"] / (s[\"prefill_ms\"] / 1e3), 1))"
            kill $pid; wait $pid'

# Raspberry Pi 5: build, the full HTTP contract, one decode number, and the
# C23 app suite with real inference —
# on the reference board through its self-hosted runner. Manual only: the
# board is shared and thermally fragile, so every heavy step goes through
# ~/bin/with-pi-lock (see CLAUDE.local.md in the engine repo).
name: pi5

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi5
  cancel-in-progress: false

jobs:
  run:
    runs-on: [self-hosted, pi5]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: build (clones the pinned engine)
        run: ~/bin/with-pi-lock make TARGET=pi5
      - name: reference model (SHA-gated, cached in the engine tree)
        run: make TARGET=pi5 fetch-model
      - name: board must be cool and idle before measuring
        run: |
          t=$(cat /sys/class/thermal/thermal_zone0/temp); l=$(cut -d' ' -f1 /proc/loadavg)
          echo "temp=$t load=$l"; test "$t" -lt 60000
      - name: smoke + wire-level suite
        run: OMP_NUM_THREADS=4 ~/bin/with-pi-lock make TARGET=pi5 test
      - name: decode rate through /api/generate
        run: |
          ~/bin/with-pi-lock sh -c '
            OMP_NUM_THREADS=4 ./geist-serve geistlib/gguf_artifacts/smollm2-360m-instruct-q8_0.gguf --port 28090 2>/tmp/gs.log &
            pid=$!; for i in $(seq 1 60); do grep -q listening /tmp/gs.log && break; sleep 1; done
            curl -s http://127.0.0.1:28090/api/generate -d "{\"prompt\":\"Write a paragraph about rivers.\",\"stream\":false,\"options\":{\"num_predict\":64,\"temperature\":0}}" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(\"decode tok/s:\", round(d[\"eval_count\"]/(d[\"eval_duration\"]/1e9),1), \"prefill tok/s:\", round(d[\"prompt_eval_count\"]/(d[\"prompt_eval_duration\"]/1e9),1))"
            kill $pid; wait $pid'
      # The app suite comes last: it heats the board, and the decode number
      # above must be measured cool. Nothing is installed on the shared board;
      # a missing dependency fails with the command to run by hand.
      - name: app dependencies present (libcurl and OpenSSL headers)
        run: |
          for p in libcurl openssl; do
            pkg-config --exists $p || { echo "missing $p development files; on the board run: sudo apt-get install libcurl4-openssl-dev libssl-dev"; exit 1; }
          done
      - name: C23 app suite with real inference (geist-app + this build's geistd)
        timeout-minutes: 50
        run: |
          OMP_NUM_THREADS=4 GEIST_TEST_MODEL="$PWD/geistlib/gguf_artifacts/smollm2-360m-instruct-q8_0.gguf" \
            GEIST_EXECUTION_DAEMON="$PWD/geistd" ~/bin/with-pi-lock make app test-app
